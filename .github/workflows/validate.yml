name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse ADMX and ADML XML
        shell: pwsh
        run: |
          [xml]$admx = Get-Content -Raw ./admx/ManagedInstallers.admx
          [xml]$adml = Get-Content -Raw ./admx/en-US/ManagedInstallers.adml

          $presentations = @{}
          foreach ($presentation in $adml.policyDefinitionResources.resources.presentationTable.presentation) {
            $presentations[$presentation.id] = $presentation
          }

          foreach ($policy in $admx.policyDefinitions.policies.policy) {
            if (-not $policy.elements) { continue }
            if ($policy.presentation -notmatch '^\$\(presentation\.([^)]+)\)$') {
              throw "Policy $($policy.name) has elements but no valid presentation reference."
            }
            if (-not $presentations.ContainsKey($Matches[1])) {
              throw "Missing presentation $($Matches[1]) for policy $($policy.name)."
            }
          }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem ./scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
